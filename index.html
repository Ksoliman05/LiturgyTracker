<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Mina Holmdel — Sunday Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #B8965A;
    --gold-light: #D4B483;
    --gold-pale: #F5EDD8;
    --deep: #1A1208;
    --ink: #2C2418;
    --muted: #7A6E60;
    --border: #E2D5BC;
    --bg: #FAF7F2;
    --card: #FFFFFF;
    --danger: #8B2020;
    --danger-bg: #FDF0F0;
    --success: #2A5C3F;
    --warning: #7A5C10;
    --warning-bg: #FDF8EE;
    --warning-border: #E8D5A0;
    --admin: #1A3A5C;
    --admin-bg: #EEF4FA;
    --admin-border: #B8D0E8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; }
  .page { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }

  .header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
  .cross { font-size: 22px; color: var(--gold); margin-bottom: 0.75rem; letter-spacing: 0.1em; }
  .church-name { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 600; color: var(--deep); letter-spacing: 0.02em; line-height: 1.2; }
  .subtitle { font-size: 0.8rem; font-weight: 400; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 0.4rem; }
  .ornament { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.25rem; justify-content: center; }
  .ornament-line { height: 1px; width: 60px; background: linear-gradient(to right, transparent, var(--gold-light)); }
  .ornament-line.right { background: linear-gradient(to left, transparent, var(--gold-light)); }
  .ornament-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }

  .controls { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; align-items: flex-end; flex-wrap: wrap; }
  .control-group { display: flex; flex-direction: column; gap: 0.35rem; }
  .control-label { font-size: 0.68rem; font-weight: 500; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }

  input[type="date"], input[type="password"], input[type="text"] {
    font-family: 'Jost', sans-serif; font-size: 0.85rem; font-weight: 400; color: var(--ink);
    background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px;
    outline: none; cursor: pointer; transition: border-color 0.15s;
  }
  input[type="date"]:focus, input[type="password"]:focus, input[type="text"]:focus { border-color: var(--gold); }

  .btn {
    font-family: 'Jost', sans-serif; font-size: 0.82rem; font-weight: 400; padding: 7px 16px;
    border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--ink);
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em; white-space: nowrap;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--gold-pale); border-color: var(--gold); color: var(--deep); }
  .btn.primary:hover { background: var(--gold); color: #fff; }
  .btn.admin-btn { border-color: var(--admin-border); color: var(--admin); background: var(--admin-bg); }
  .btn.admin-btn:hover { background: var(--admin); color: #fff; border-color: var(--admin); }
  .btn.danger-btn { border-color: #E8BBBB; color: var(--danger); background: var(--danger-bg); }
  .btn.danger-btn:hover { background: var(--danger); color: #fff; }

  .absent-section { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .absent-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .absent-label { font-size: 0.7rem; font-weight: 500; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .absent-note { font-size: 0.68rem; color: var(--muted); font-style: italic; }
  .absent-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .priest-btn { font-family: 'Jost', sans-serif; font-size: 0.82rem; font-weight: 400; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); cursor: pointer; transition: all 0.15s ease; }
  .priest-btn:hover { border-color: var(--gold); color: var(--gold); }
  .priest-btn.absent { background: var(--danger-bg); color: var(--danger); border-color: #E8BBBB; }

  .admin-login { background: var(--admin-bg); border: 1px solid var(--admin-border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: none; }
  .admin-login.visible { display: block; }
  .admin-login-row { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
  .admin-login-label { font-size: 0.7rem; font-weight: 500; color: var(--admin); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.35rem; }
  .admin-error { font-size: 0.72rem; color: var(--danger); margin-top: 0.5rem; font-style: italic; display: none; }
  .admin-error.visible { display: block; }

  .admin-panel { background: var(--admin-bg); border: 1px solid var(--admin-border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; display: none; }
  .admin-panel.visible { display: block; }
  .admin-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
  .admin-panel-title { font-size: 0.72rem; font-weight: 500; color: var(--admin); letter-spacing: 0.12em; text-transform: uppercase; }
  .admin-panel-note { font-size: 0.7rem; color: var(--admin); opacity: 0.7; font-style: italic; }
  .override-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
  .override-field { display: flex; flex-direction: column; gap: 0.3rem; }
  .override-field label { font-size: 0.68rem; font-weight: 500; color: var(--admin); letter-spacing: 0.08em; text-transform: uppercase; }
  .override-field input { font-family: 'Jost', sans-serif; font-size: 0.85rem; color: var(--ink); background: #fff; border: 1px solid var(--admin-border); border-radius: 8px; padding: 6px 10px; outline: none; }
  .override-field input:focus { border-color: var(--admin); }
  .override-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

  .override-active-banner { background: var(--admin-bg); border: 1px solid var(--admin-border); border-radius: 8px; padding: 0.6rem 1rem; margin-bottom: 1.25rem; font-size: 0.75rem; color: var(--admin); display: none; align-items: center; justify-content: space-between; gap: 1rem; }
  .override-active-banner.visible { display: flex; }

  .edge-banner { background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: 8px; padding: 0.65rem 1rem; margin-bottom: 1.25rem; font-size: 0.78rem; color: var(--warning); line-height: 1.5; display: none; }
  .edge-banner.visible { display: block; }
  .edge-banner strong { font-weight: 500; }

  .status-bar { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.75rem; font-style: italic; text-align: center; min-height: 1.2em; }

  .weeks { display: flex; flex-direction: column; gap: 1.25rem; }
  .week-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .week-card.current { border-color: var(--gold); box-shadow: 0 2px 16px rgba(184,150,90,0.12); }
  .week-card.overridden { border-color: var(--admin); box-shadow: 0 2px 16px rgba(26,58,92,0.1); }

  .week-header { padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border); background: #FDFBF7; display: flex; align-items: center; justify-content: space-between; }
  .week-card.current .week-header { background: var(--gold-pale); }
  .week-card.overridden .week-header { background: var(--admin-bg); }

  .week-date { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 500; color: var(--deep); }
  .current-badge { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); background: rgba(184,150,90,0.1); border: 1px solid rgba(184,150,90,0.3); padding: 3px 10px; border-radius: 20px; }
  .lookup-badge { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: #F5F2EC; border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; }
  .override-badge { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--admin); background: var(--admin-bg); border: 1px solid var(--admin-border); padding: 3px 10px; border-radius: 20px; }

  .liturgies { display: grid; grid-template-columns: repeat(3, 1fr); }
  .liturgy { padding: 1.1rem 1.25rem; border-right: 1px solid var(--border); }
  .liturgy:last-child { border-right: none; }
  .liturgy-title { font-size: 0.65rem; font-weight: 500; color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.6rem; }
  .priest-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; color: var(--deep); line-height: 1.3; }
  .priest-name.visitor { color: var(--muted); font-style: italic; }
  .role-label { font-size: 0.7rem; font-weight: 400; color: var(--muted); margin-top: 1px; letter-spacing: 0.04em; }
  .role-label.celebrant { color: var(--success); }
  .third-pair { display: flex; flex-direction: column; gap: 0.7rem; }
  .third-pair .divider { height: 1px; background: var(--border); }

  .admin-trigger { position: fixed; bottom: 1.5rem; right: 1.5rem; font-size: 0.7rem; color: var(--border); background: none; border: none; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; }
  .admin-trigger:hover { color: var(--muted); }

  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .liturgies { grid-template-columns: 1fr; }
    .liturgy { border-right: none; border-bottom: 1px solid var(--border); }
    .liturgy:last-child { border-bottom: none; }
    .church-name { font-size: 1.7rem; }
    .controls { flex-direction: column; align-items: stretch; }
    .override-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="cross">✦ ✦ ✦</div>
    <div class="church-name">St. Mina Holmdel</div>
    <div class="subtitle">Sunday Liturgy Schedule</div>
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line right"></div>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <div class="control-label">Jump to date</div>
      <input type="date" id="date-picker">
    </div>
    <button class="btn primary" onclick="lookupDate()">View schedule</button>
    <button class="btn" onclick="resetToToday()">Back to today</button>
  </div>

  <div class="admin-login" id="admin-login">
    <div class="admin-login-label">Admin access</div>
    <div class="admin-login-row">
      <div class="control-group">
        <input type="password" id="admin-pw" placeholder="Enter PIN" onkeydown="if(event.key==='Enter') verifyAdmin()">
      </div>
      <button class="btn admin-btn" onclick="verifyAdmin()">Unlock</button>
      <button class="btn" onclick="closeAdminLogin()">Cancel</button>
    </div>
    <div class="admin-error" id="admin-error">Incorrect PIN — try again</div>
  </div>

  <div class="override-active-banner" id="override-banner">
    <span>&#9632; Manual override is active for this Sunday</span>
    <button class="btn danger-btn" onclick="showAdminLoginForClear()">Clear override</button>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="admin-panel-header">
      <div class="admin-panel-title">&#9632; Manual override — this Sunday</div>
      <div class="admin-panel-note">Absence toggles disabled while override is active</div>
    </div>
    <div class="override-grid">
      <div class="override-field">
        <label>1st Liturgy — Celebrant</label>
        <input type="text" id="ov-first" placeholder="e.g. Fr. Abraam">
      </div>
      <div class="override-field">
        <label>2nd Liturgy — Celebrant</label>
        <input type="text" id="ov-second" placeholder="e.g. Fr. Abraham">
      </div>
      <div class="override-field">
        <label>3rd Liturgy — Celebrant</label>
        <input type="text" id="ov-thirdc" placeholder="e.g. Fr. Mina">
      </div>
      <div class="override-field">
        <label>3rd Liturgy — Assistant</label>
        <input type="text" id="ov-thirda" placeholder="e.g. Fr. Anastasi">
      </div>
    </div>
    <div class="override-actions">
      <button class="btn admin-btn" onclick="applyOverride()">Apply override</button>
      <button class="btn danger-btn" onclick="clearOverride()">Clear override</button>
      <button class="btn" onclick="lockAdmin()">Lock</button>
    </div>
  </div>

  <div class="absent-section" id="absent-section">
    <div class="absent-section-header">
      <div class="absent-label">Mark as absent this Sunday</div>
      <div class="absent-note">affects this Sunday only</div>
    </div>
    <div class="absent-buttons" id="absent-buttons"></div>
  </div>

  <div class="edge-banner" id="edge-banner"></div>
  <div class="status-bar" id="status-bar"></div>
  <div class="weeks" id="weeks"></div>

</div>

<button class="admin-trigger" id="admin-trigger" onclick="showAdminLogin()">admin</button>

<script>
  const SUPABASE_URL = 'https://heumyysjddepslkwnidz.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_ZZukcGMRB_mRvRR25zonGQ_71slbcml';
  const HASH = 'b616a530ed23eed5da7b3ec2864d174ca84d47b3c5b251cf11fb5e226dfc187e';

  const PRIESTS = ['Fr. Abraam', 'Fr. Abraham', 'Fr. Mina', 'Fr. Anastasi'];
  const CYCLE = [
    { first: 0, second: 1, thirdC: 2, thirdA: 3 },
    { first: 1, second: 2, thirdC: 3, thirdA: 0 },
    { first: 2, second: 3, thirdC: 0, thirdA: 1 },
    { first: 3, second: 0, thirdC: 1, thirdA: 2 },
  ];
  const ANCHOR = new Date(2025, 1, 1);

  let absentSet = new Set();
  let lookupMode = false;
  let adminUnlocked = false;
  let override = null; // loaded from Supabase or set locally

  // ── Supabase helpers ──────────────────────────────────────────

  function supaHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON,
      'Authorization': 'Bearer ' + SUPABASE_ANON,
      'Prefer': 'return=representation'
    };
  }

  function toISODate(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  async function fetchOverride(sundayDate) {
    const iso = toISODate(sundayDate);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/override?sunday_date=eq.${iso}&select=*`,
      { headers: supaHeaders() }
    );
    const data = await res.json();
    return data && data.length > 0 ? data[0] : null;
  }

  async function saveOverride(sundayDate, values) {
    const iso = toISODate(sundayDate);
    const payload = {
      sunday_date: iso,
      first: values.first,
      second: values.second,
      third_celebrant: values.thirdC,
      third_assistant: values.thirdA
    };
    // Upsert — insert or update if exists
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/override`,
      {
        method: 'POST',
        headers: { ...supaHeaders(), 'Prefer': 'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify(payload)
      }
    );
    return res.ok;
  }

  async function deleteOverride(sundayDate) {
    const iso = toISODate(sundayDate);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/override?sunday_date=eq.${iso}`,
      { method: 'DELETE', headers: supaHeaders() }
    );
    return res.ok;
  }

  // ── Date helpers ─────────────────────────────────────────────

  function getNextSunday(from) {
    const d = new Date(from);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? 0 : 7 - day));
    return d;
  }

  function getCycleIndex(date) {
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const anchorSunday = getNextSunday(ANCHOR);
    const weeksDiff = Math.round((date - anchorSunday) / msPerWeek);
    return ((weeksDiff % 4) + 4) % 4;
  }

  function formatDate(d) {
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function getSundays() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const first = getNextSunday(today);
    return [0, 1, 2].map(i => {
      const d = new Date(first);
      d.setDate(d.getDate() + i * 7);
      return d;
    });
  }

  // ── Edge case logic ───────────────────────────────────────────
  // Rule: 3rd Assistant covers whoever is missing. Visitor fills 3rd Assistant.

  function applyEdgeCases(slot) {
    if (absentSet.size === 0) return { slot, edgeMsg: null };
    const absent = [...absentSet][0];
    let s = { ...slot };

    const role =
      s.first === absent ? 'first' :
      s.second === absent ? 'second' :
      s.thirdC === absent ? 'thirdC' :
      s.thirdA === absent ? 'thirdA' : null;

    if (!role) return { slot: s, edgeMsg: null };

    let edgeMsg = '';

    if (role === 'thirdA') {
      s.thirdA = 'visitor';
      edgeMsg = `<strong>${PRIESTS[absent]}</strong> is absent as 3rd Assistant — a visiting priest fills that slot. <em>Confirm with clergy.</em>`;
    } else {
      // 3rd assistant covers the missing role
      const coveringPriest = PRIESTS[s.thirdA];
      if (role === 'first') s.first = s.thirdA;
      else if (role === 'second') s.second = s.thirdA;
      else if (role === 'thirdC') s.thirdC = s.thirdA;
      s.thirdA = 'visitor';
      edgeMsg = `<strong>${PRIESTS[absent]}</strong> is absent — <strong>${coveringPriest}</strong> covers their role, visiting priest assists at 3rd. <em>Confirm with clergy.</em>`;
    }

    return { slot: s, edgeMsg };
  }

  // ── Auth ──────────────────────────────────────────────────────

  async function sha256(message) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(message));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  let pendingClear = false;

  async function verifyAdmin() {
    const input = document.getElementById('admin-pw').value;
    const hashed = await sha256(input);
    if (hashed === HASH) {
      adminUnlocked = true;
      document.getElementById('admin-login').classList.remove('visible');
      document.getElementById('admin-pw').value = '';
      document.getElementById('admin-error').classList.remove('visible');
      document.getElementById('admin-trigger').style.display = 'none';
      if (pendingClear) {
        pendingClear = false;
        clearOverride();
      } else {
        document.getElementById('admin-panel').classList.add('visible');
        // Pre-fill fields
        const sundays = getSundays();
        const ci = getCycleIndex(sundays[0]);
        const slot = CYCLE[ci];
        document.getElementById('ov-first').value = override ? override.first : PRIESTS[slot.first];
        document.getElementById('ov-second').value = override ? override.second : PRIESTS[slot.second];
        document.getElementById('ov-thirdc').value = override ? override.thirdC : PRIESTS[slot.thirdC];
        document.getElementById('ov-thirda').value = override ? override.thirdA : PRIESTS[slot.thirdA];
      }
    } else {
      document.getElementById('admin-error').classList.add('visible');
    }
  }

  function showAdminLogin() {
    pendingClear = false;
    document.getElementById('admin-login').classList.add('visible');
    setTimeout(() => document.getElementById('admin-pw').focus(), 50);
  }

  function showAdminLoginForClear() {
    pendingClear = true;
    document.getElementById('admin-login').classList.add('visible');
    setTimeout(() => document.getElementById('admin-pw').focus(), 50);
  }

  function closeAdminLogin() {
    document.getElementById('admin-login').classList.remove('visible');
    document.getElementById('admin-pw').value = '';
    document.getElementById('admin-error').classList.remove('visible');
  }

  function lockAdmin() {
    adminUnlocked = false;
    document.getElementById('admin-panel').classList.remove('visible');
    document.getElementById('admin-trigger').style.display = 'block';
  }

  async function applyOverride() {
    const first = document.getElementById('ov-first').value.trim();
    const second = document.getElementById('ov-second').value.trim();
    const thirdC = document.getElementById('ov-thirdc').value.trim();
    const thirdA = document.getElementById('ov-thirda').value.trim();
    if (!first || !second || !thirdC || !thirdA) { alert('Please fill in all four fields.'); return; }

    setStatus('<span class="spinner"></span> Saving override...');
    const sunday = getSundays()[0];
    const ok = await saveOverride(sunday, { first, second, thirdC, thirdA });
    if (ok) {
      override = { first, second, thirdC, thirdA };
      absentSet.clear();
      lockAdmin();
      setStatus('');
      render();
    } else {
      setStatus('Failed to save — check your connection.');
    }
  }

  async function clearOverride() {
    setStatus('<span class="spinner"></span> Clearing override...');
    const sunday = getSundays()[0];
    await deleteOverride(sunday);
    override = null;
    lockAdmin();
    document.getElementById('override-banner').classList.remove('visible');
    setStatus('');
    render();
  }

  // ── Rendering ─────────────────────────────────────────────────

  function setStatus(msg) {
    document.getElementById('status-bar').innerHTML = msg;
  }

  function priestBlock(name, role) {
    const isVisitor = name === 'visitor';
    const displayName = isVisitor ? 'Visiting Priest' : name;
    const nameClass = isVisitor ? 'priest-name visitor' : 'priest-name';
    const roleClass = role === 'Celebrant' ? 'role-label celebrant' : 'role-label';
    return `<div class="${nameClass}">${displayName}</div><div class="${roleClass}">${role}</div>`;
  }

  function renderCard(sunday, isCurrent, isLookup) {
    const ci = getCycleIndex(sunday);
    const baseSlot = { ...CYCLE[ci] };
    let names, edgeMsg = null, isOverridden = false;

    if (isCurrent && override) {
      names = { first: override.first, second: override.second, thirdC: override.thirdC, thirdA: override.thirdA };
      isOverridden = true;
    } else if (isCurrent && absentSet.size > 0) {
      const result = applyEdgeCases(baseSlot);
      const s = result.slot;
      edgeMsg = result.edgeMsg;
      names = {
        first: typeof s.first === 'number' ? PRIESTS[s.first] : s.first,
        second: typeof s.second === 'number' ? PRIESTS[s.second] : s.second,
        thirdC: typeof s.thirdC === 'number' ? PRIESTS[s.thirdC] : s.thirdC,
        thirdA: typeof s.thirdA === 'number' ? PRIESTS[s.thirdA] : s.thirdA,
      };
    } else {
      names = {
        first: PRIESTS[baseSlot.first],
        second: PRIESTS[baseSlot.second],
        thirdC: PRIESTS[baseSlot.thirdC],
        thirdA: PRIESTS[baseSlot.thirdA],
      };
    }

    const cardClass = isOverridden ? 'week-card overridden' : isCurrent ? 'week-card current' : 'week-card';
    const badge = isOverridden
      ? '<div class="override-badge">&#9632; Manually overridden</div>'
      : isCurrent ? '<div class="current-badge">This Sunday</div>'
      : isLookup ? '<div class="lookup-badge">Looked up</div>' : '';

    return { html: `
      <div class="${cardClass}">
        <div class="week-header">
          <div class="week-date">${formatDate(sunday)}</div>
          ${badge}
        </div>
        <div class="liturgies">
          <div class="liturgy">
            <div class="liturgy-title">1st Liturgy</div>
            ${priestBlock(names.first, 'Celebrant')}
          </div>
          <div class="liturgy">
            <div class="liturgy-title">2nd Liturgy</div>
            ${priestBlock(names.second, 'Celebrant')}
          </div>
          <div class="liturgy">
            <div class="liturgy-title">3rd Liturgy</div>
            <div class="third-pair">
              <div>${priestBlock(names.thirdC, 'Celebrant')}</div>
              <div class="divider"></div>
              <div>${priestBlock(names.thirdA, 'Assistant')}</div>
            </div>
          </div>
        </div>
      </div>`, edgeMsg, isOverridden };
  }

  function renderAbsentButtons() {
    const container = document.getElementById('absent-buttons');
    container.innerHTML = '';
    PRIESTS.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'priest-btn' + (absentSet.has(i) ? ' absent' : '');
      btn.textContent = absentSet.has(i) ? p + ' — absent' : p;
      btn.onclick = () => {
        if (absentSet.has(i)) absentSet.delete(i); else { absentSet.clear(); absentSet.add(i); }
        render();
      };
      container.appendChild(btn);
    });
  }

  function lookupDate() {
    const picker = document.getElementById('date-picker');
    if (!picker.value) return;
    const [y, m, d] = picker.value.split('-').map(Number);
    lookupMode = getNextSunday(new Date(y, m - 1, d));
    render();
  }

  function resetToToday() {
    lookupMode = false;
    absentSet.clear();
    document.getElementById('date-picker').value = '';
    render();
  }

  function render() {
    renderAbsentButtons();
    const absentSection = document.getElementById('absent-section');
    const banner = document.getElementById('edge-banner');
    const overrideBanner = document.getElementById('override-banner');
    const container = document.getElementById('weeks');
    container.innerHTML = '';
    banner.className = 'edge-banner';
    banner.innerHTML = '';

    if (lookupMode) {
      absentSection.style.display = 'none';
      overrideBanner.classList.remove('visible');
      const { html } = renderCard(lookupMode, false, true);
      container.innerHTML = html;
    } else {
      absentSection.style.display = override ? 'none' : 'block';
      overrideBanner.classList.toggle('visible', !!override);
      const sundays = getSundays();
      let edgeMsgToShow = null;
      sundays.forEach((sunday, wi) => {
        const isCurrent = wi === 0;
        const { html, edgeMsg } = renderCard(sunday, isCurrent, false);
        if (isCurrent && edgeMsg) edgeMsgToShow = edgeMsg;
        container.innerHTML += html;
      });
      if (edgeMsgToShow) { banner.innerHTML = edgeMsgToShow; banner.className = 'edge-banner visible'; }
    }
  }

  // ── Init: load override from Supabase ─────────────────────────

  async function init() {
    setStatus('<span class="spinner"></span> Loading schedule...');
    try {
      const sunday = getSundays()[0];
      const row = await fetchOverride(sunday);
      if (row) {
        override = { first: row.first, second: row.second, thirdC: row.third_celebrant, thirdA: row.third_assistant };
      }
    } catch(e) {
      console.warn('Could not load override:', e);
    }
    setStatus('');
    render();
  }

  init();
</script>
</body>
</html>
